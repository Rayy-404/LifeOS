name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + E2E)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: dev-only-password
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lifeos:dev-only-password@localhost:5432/lifeos?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests (journey suite, retry 2x)
        run: npm run test:e2e:ci

  mobile:
    name: Mobile (analyze + unit/widget tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

  mobile-integration:
    name: Mobile (integration journey on emulator)
    runs-on: ubuntu-latest
    # Skenario ini butuh emulator Android (KVM). Perilaku OEM battery saver
    # terhadap alarm lokal TIDAK bisa diuji andal di CI — lihat README bagian
    # "Keterbatasan Verifikasi Manual".
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: dev-only-password
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://lifeos:dev-only-password@localhost:5432/lifeos?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Prepare backend
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          nohup node dist/main.js > /tmp/lifeos-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start" && cat /tmp/lifeos-backend.log && exit 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            adb reverse tcp:3000 tcp:3000
            adb shell pm grant com.lifeos.lifeos_mobile android.permission.POST_NOTIFICATIONS || true
            flutter test integration_test -d emulator-5554
