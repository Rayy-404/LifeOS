name: lifeos_mobile
description: "LifeOS — Personal Productivity & Academic OS for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons & UI Design System
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.0
  google_fonts: 8.0.0
  flutter_svg: ^2.3.0
  shimmer: ^4.0.0

  # State Management & Navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Networking & Connectivity
  dio: ^5.11.1
  connectivity_plus: ^7.3.2

  # Secure Storage & Local Read Cache
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Local Notifications & Timezone
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.3

  # Feature Widgets (Calendar & Analytics Charts)
  table_calendar: ^3.3.0
  fl_chart: ^1.2.0

  # Utilities
  equatable: ^2.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

